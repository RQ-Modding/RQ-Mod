name: Build

# Every push and pull request builds the Windows package and keeps it as a workflow artifact.
# A tag v<version> (matching RQ_VERSION in include/modloader.h) also publishes it as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# The Release step creates the GitHub release: the organization's default token only reads
# (Rance Browser's first release failed with "Resource not accessible by integration").
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    name: Windows
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          # UCRT64: MSYS2 deprecated MINGW64 (the old msvcrt.dll runtime) and drops packages from it.
          msystem: UCRT64
          update: true
          # flex and bison build libsys4's ini parser. base-devel brought them until its 2026.11 update.
          # cglm is not installed: meson builds its wrap (subprojects/cglm.wrap), here as in a local
          # build, and dist/ brings its license.
          # No FFmpeg: Rance Quest plays no movie (its AIN loads neither DrawMovie nor PlayMovie), so
          # meson builds the movie player on pl_mpeg (include/pl_mpeg.h, MIT), as upstream does
          # without FFmpeg.
          install: >-
            base-devel
            flex
            bison
            git
            diffutils
            zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-libsndfile
            mingw-w64-ucrt-x86_64-glew

      # libjpeg-turbo 3.2.1 puts a copy of zlib inside its static library, so a static link beside
      # zlib fails (z_errmsg defined twice). 3.2.0 links. Rance Browser's workflow pins it the same way.
      - name: Pin libjpeg-turbo 3.2.0
        run: pacman -U --noconfirm https://repo.msys2.org/mingw/ucrt64/mingw-w64-ucrt-x86_64-libjpeg-turbo-3.2.0-1-any.pkg.tar.zst

      # rq.ids: the module, the annotations and ids.json must be what data/ids gives.
      - name: Check rq.ids
        run: python tools/ids/gen_ids.py --check

      - name: Build
        run: |
          meson setup build --buildtype=release
          ninja -C build

      - name: Version
        id: version
        run: |
          v=$(sed -n 's/^#define RQ_VERSION "\(.*\)"/\1/p' include/modloader.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          # The project's stage ("Public Beta"), after the version in the release's name.
          stage=$(sed -n 's/^#define RQ_STAGE "\(.*\)"/\1/p' include/modloader.h)
          echo "title=RQ MOD $v${stage:+ $stage}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$v" ]]; then
            echo "Tag ${GITHUB_REF#refs/tags/} does not match RQ_VERSION $v" >&2
            exit 1
          fi

      - name: Package
        run: |
          pkg=RQ-MOD
          mkdir -p $pkg/xsystem4 $pkg/mods
          cp build/src/xsystem4.exe build/tools/rqmod-ctl/rqmod-ctl.exe build/tools/rqmod-aff/rqmod-aff.exe build/subprojects/rance-browser/rance-browser.exe build/subprojects/rq-scene-editor/rq-scene-editor.exe /ucrt64/bin/glew32.dll $pkg/xsystem4/
          cp -r fonts shaders $pkg/xsystem4/
          cp -r dist/. $pkg/
          cp README.md CHANGELOG.md CREDITS.md COPYING $pkg/xsystem4/
          # The API reference offline, one page, with the game's numbers (dist/ brings RQ-MOD-README.txt).
          python tools/apidoc/rqdoc.py html dist/lua/rq.lua $pkg/xsystem4/api.html data/ids/ids.json
          mkdir -p $pkg/xsystem4/licenses && cp -r /ucrt64/share/licenses/. $pkg/xsystem4/licenses/
          # Rance Browser (subprojects/rance-browser) and RQ Scene Editor (subprojects/rq-scene-editor),
          # GPL-2.0-or-later: their credits, and Dear ImGui and cimgui (MIT), built into both.
          mkdir -p $pkg/xsystem4/licenses/imgui $pkg/xsystem4/licenses/cimgui $pkg/xsystem4/licenses/rance-browser $pkg/xsystem4/licenses/rq-scene-editor
          cp subprojects/rance-browser/third_party/cimgui/imgui/LICENSE.txt $pkg/xsystem4/licenses/imgui/
          cp subprojects/rance-browser/third_party/cimgui/LICENSE $pkg/xsystem4/licenses/cimgui/
          cp subprojects/rance-browser/CREDITS.md subprojects/rance-browser/README.md $pkg/xsystem4/licenses/rance-browser/
          cp subprojects/rq-scene-editor/CREDITS.md subprojects/rq-scene-editor/README.md $pkg/xsystem4/licenses/rq-scene-editor/
          # Symbol list for crash reports: "RVA name", with the exe size first.
          size=$(stat -c %s build/src/xsystem4.exe)
          { echo "# exe-size $size"
            nm -n build/src/xsystem4.exe | awk '$2 ~ /^[tT]$/ { printf "%x %s\n", strtonum("0x"$1) - 0x140000000, $3 }' | awk '$1 !~ /^-/'
          } > $pkg/xsystem4/xsystem4.sym
          cd $pkg && zip -r -9 ../RQ-MOD-${{ steps.version.outputs.version }}-windows.zip . && cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RQ-MOD-${{ steps.version.outputs.version }}-windows
          path: RQ-MOD-${{ steps.version.outputs.version }}-windows.zip

      # The release page: what RQ MOD is, how to install it, the programs in the zip, what this
      # release brings (.github/release-notes/<version>.md, written for it, when there is one), and
      # every CHANGELOG section since the last release: a version never released on its own goes out
      # with the next one.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${{ steps.version.outputs.version }}"
          # The last release before this one, from the repository's tags.
          prev=$( { git ls-remote --tags --refs origin 'v*' | sed -n 's#.*refs/tags/v\([0-9][0-9.]*\)$#\1#p'; echo "$v"; } | sort -uV | awk -v v="$v" '$0 == v { print p; exit } { p = $0 }')
          echo "Release notes for $v, since ${prev:-the start}"
          cat > notes.md <<'EOF'
          Mod support for **Rance Quest Magnum**: mods in Lua, loaded at runtime. RQ MOD is a fork of [xsystem4](https://github.com/nunuhara/xsystem4); see [CREDITS.md](https://github.com/RQ-Modding/RQ-Mod/blob/main/CREDITS.md).

          **Public beta:** the tools that help make new content are not done yet.

          **Install:** extract the zip into the game's folder and start `xsystem4\xsystem4.exe`. Put each mod's folder under `mods`. The [install guide](https://rq-modding.github.io/rq-modding-docs/guide/install) has the details, and where the logs are when something goes wrong.

          **Docs and the API reference:** https://rq-modding.github.io/rq-modding-docs/ (the reference is also in the zip, offline: `xsystem4\api.html`; `RQ-MOD-README.txt` has the steps).

          **Community:** [RQ MOD on Discord](https://discord.gg/maCKqfTGne), the official server (also the Discord icon by the version on the main menu); [Rance & Alicesoft Western Community](https://discord.gg/RANCE) on Discord; [Moru on X (Twitter)](https://x.com/Moru_zerinho6).

          EOF
          # The programs beside the engine, each at the version its submodule's meson.build gives.
          rb=$(sed -n "s/^ *version : '\([^']*\)'.*/\1/p" subprojects/rance-browser/meson.build | head -1)
          se=$(sed -n "s/^ *version : '\([^']*\)'.*/\1/p" subprojects/rq-scene-editor/meson.build | head -1)
          g=https://rq-modding.github.io/rq-modding-docs/guide
          {
            printf '## In the zip\n\nIn the game'"'"'s `xsystem4` folder, beside the engine (`xsystem4.exe`):\n\n'
            printf -- '- **[Rance Browser](https://github.com/RQ-Modding/rance-browser) %s** (`rance-browser.exe`): the game'"'"'s pictures, Flash files, music, sounds, 3D models and names, each with the Lua line that changes it. Guide: [Looking through the game'"'"'s files](%s/file-browser).\n' "$rb" "$g"
            printf -- '- **[RQ Scene Editor](https://github.com/RQ-Modding/rq-scene-editor) %s** (`rq-scene-editor.exe`): writes a mod'"'"'s scene files and plays them in the game. Guide: [Writing scenes in the scene editor](%s/scene-editor).\n' "$se" "$g"
            printf -- '- **rqmod-aff** (`rqmod-aff.exe`): makes and checks a mod'"'"'s Flash animations. Guide: [Animations](%s/animations).\n' "$g"
            printf -- '- **rqmod-ctl** (`rqmod-ctl.exe`): drives the running game from a script; run alone, it lists its commands.\n\n'
          } >> notes.md
          if [ -f ".github/release-notes/$v.md" ]; then
            cat ".github/release-notes/$v.md" >> notes.md
            echo >> notes.md
          fi
          if [ -n "$prev" ]; then printf '## Changes since %s\n' "$prev" >> notes.md; else printf '## Changes in %s\n' "$v" >> notes.md; fi
          # From this version's section down to the last release's (without one, this section alone).
          awk -v v="$v" -v prev="$prev" '/^## / { if (on && (prev == "" || $2 == prev)) exit; if ($2 == v) on = 1; if (on) print "\n### " $2; next } on' CHANGELOG.md >> notes.md
          printf '\nEvery version: [CHANGELOG.md](https://github.com/RQ-Modding/RQ-Mod/blob/main/CHANGELOG.md)\n' >> notes.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.title }}
          body_path: notes.md
          files: RQ-MOD-${{ steps.version.outputs.version }}-windows.zip
          fail_on_unmatched_files: true
